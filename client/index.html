<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AeroShield AI — Winter Smog & Urban Clean Air Navigator</title>
    <meta name="description" content="GenAI-powered clean air copilot for families and communities navigating severe winter smog, temperature inversions, and urban particulate pollution." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍃</text></svg>">
    <script>
      // Filter out Chrome Extension noise from devtools console audit
      window.addEventListener('securitypolicyviolation', function(e) {
        if (e.sourceFile && (e.sourceFile.includes('chrome-extension') || e.sourceFile.includes('content.js'))) {
          e.stopPropagation();
        }
      }, true);
      window.addEventListener('error', function(e) {
        if ((e.filename && (e.filename.includes('chrome-extension') || e.filename.includes('content.js'))) ||
            (e.message && e.message.includes('Content Security Policy directive'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
